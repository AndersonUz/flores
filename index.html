<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores amarillas para ti</title>

<!-- ============ VISTA PREVIA AL COMPARTIR POR WHATSAPP ============ -->
<meta property="og:title" content="Alguien te dejó unas flores amarillas">
<meta property="og:description" content="Ábrelas.">
<meta property="og:type" content="website">
<!-- Sube una imagen 1200x630 al repo y pon aquí la URL completa:
<meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPO/preview.jpg"> -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --noche:#0A1724;
  --profundo:#12293B;
  --horizonte:#E08A2B;
  --sol:#F5C518;
  --sol-claro:#FFE27A;
  --ambar:#D98324;
  --centro:#43260F;
  --tallo:#2F6B4F;
  --crema:#FDF6E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--noche);
  color:var(--crema);
  font-family:'Karla',system-ui,-apple-system,sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- CIELO ---------- */
.escena{position:fixed;inset:0;overflow:hidden}
.cielo{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 55% at 50% 100%, rgba(224,138,43,.55) 0%, rgba(224,138,43,0) 60%),
    linear-gradient(180deg, #071019 0%, var(--noche) 32%, var(--profundo) 72%, #1E4657 100%);
}
.estrella{position:absolute;border-radius:50%;background:var(--crema);animation:titilar 4s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.15}50%{opacity:.75}}

canvas#petalos{position:absolute;inset:0;pointer-events:none}

/* ---------- MENSAJE ---------- */
.mensaje{
  position:absolute;left:50%;top:14%;transform:translateX(-50%);
  width:min(92vw,42rem);text-align:center;z-index:3;
  padding:0 1rem;
  opacity:0;
}
.mensaje.visible{animation:respirar 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes respirar{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.mensaje h1{
  font-family:'Fraunces',Georgia,serif;
  font-weight:400;font-size:clamp(2.1rem,7.5vw,3.9rem);
  line-height:1.03;letter-spacing:-.015em;
  text-shadow:0 2px 30px rgba(10,23,36,.9);
}
.mensaje p{
  margin:1.2rem auto 0;max-width:32ch;
  font-size:clamp(1rem,3.6vw,1.15rem);font-weight:300;line-height:1.65;
  color:rgba(253,246,227,.82);
  text-shadow:0 2px 20px rgba(10,23,36,.95);
}
.firma{
  margin-top:1.6rem;font-family:'Fraunces',serif;font-style:italic;
  font-size:1rem;color:rgba(245,197,24,.85)
}

/* ---------- JARDÍN ---------- */
.jardin{position:absolute;left:0;right:0;bottom:0;height:62vmin;z-index:2}
.flor{
  position:absolute;bottom:-2vmin;
  width:calc(var(--w) * 1vmin);
  transform-origin:50% 100%;
}
.flor.mece{animation:mecer var(--vel) ease-in-out infinite alternate;animation-delay:var(--desf)}
@keyframes mecer{from{transform:rotate(calc(var(--giro) * -1deg))}to{transform:rotate(var(--giro))}}
.flor svg{display:block;width:100%;height:auto;overflow:visible}

.tallo{fill:none;stroke:var(--tallo);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:1.02;stroke-dashoffset:1.02}
.hoja{fill:var(--tallo);transform:scale(0)}
.hoja-izq{transform-origin:70px 206px}
.hoja-der{transform-origin:70px 172px}
.petalo{transform-origin:70px 78px;transform:scale(0)}
.nucleo{transform-origin:70px 78px;transform:scale(0)}
.cabeza{filter:drop-shadow(0 0 16px rgba(245,197,24,.28))}

/* la secuencia: solo corre cuando se abre */
.abierto .tallo{animation:crecer 1.15s cubic-bezier(.3,.7,.3,1) forwards;animation-delay:var(--t)}
.abierto .hoja{animation:brotar .65s cubic-bezier(.34,1.5,.6,1) forwards;animation-delay:calc(var(--t) + .55s)}
.abierto .nucleo{animation:brotar .5s ease-out forwards;animation-delay:calc(var(--t) + .95s)}
.abierto .petalo{animation:brotar .62s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--t) + 1s + var(--p))}
@keyframes crecer{to{stroke-dashoffset:0}}
@keyframes brotar{to{transform:scale(1)}}

/* ---------- PORTADA ---------- */
.portada{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;padding:2rem;text-align:center;
  background:radial-gradient(70% 70% at 50% 45%, rgba(10,23,36,.55), rgba(7,16,25,.92));
  transition:opacity .7s ease, visibility .7s;
}
.portada.fuera{opacity:0;visibility:hidden}
.portada p{
  font-family:'Fraunces',serif;font-weight:300;
  font-size:clamp(1.15rem,4.4vw,1.5rem);line-height:1.5;max-width:22ch;
  color:rgba(253,246,227,.9);
}
.capullo{width:clamp(72px,18vw,110px);animation:latir 3.2s ease-in-out infinite}
@keyframes latir{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
.btn{
  font-family:'Karla',sans-serif;font-size:1.05rem;font-weight:500;
  color:var(--noche);background:linear-gradient(180deg,var(--sol-claro),var(--sol));
  border:none;border-radius:999px;padding:.95rem 2.3rem;cursor:pointer;
  box-shadow:0 0 0 0 rgba(245,197,24,.45), 0 10px 30px rgba(245,197,24,.25);
  transition:transform .2s ease, box-shadow .3s ease;
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 10px rgba(245,197,24,.08), 0 14px 34px rgba(245,197,24,.3)}
.btn:focus-visible{outline:2px solid var(--sol-claro);outline-offset:4px}

/* ---------- DETALLES ---------- */
.pista{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
  z-index:4;font-size:.82rem;letter-spacing:.02em;
  color:rgba(253,246,227,.4);opacity:0;transition:opacity 1s ease 2.6s
}
.pista.visible{opacity:1}
.sonido{
  position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;z-index:5;
  width:42px;height:42px;border-radius:50%;cursor:pointer;display:none;
  place-items:center;font-size:1rem;
  background:rgba(253,246,227,.08);border:1px solid rgba(253,246,227,.18);color:var(--crema);
}
.sonido.activa{display:grid}

@media (prefers-reduced-motion:reduce){
  .flor.mece{animation:none}
  .estrella{animation:none;opacity:.5}
  .capullo{animation:none}
  .abierto .tallo{animation-duration:.01s}
  .abierto .hoja,.abierto .nucleo,.abierto .petalo{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>

<!-- ================================================================
     CONFIGURACIÓN — cambia solo esto
     ================================================================ -->
<script>
const CONFIG = {
  nombre: "Sofia",                 // ej: "Rosa" → "Flores amarillas para Rosa". Vacío = "para ti"
  mensaje: "Porque hoy es 21 de septiembre y quería hacerte este detalle.",
  firma:   "Ander",                // ej: "— Anderson". Vacío = no aparece
  musica:  "cancion.mp3",                // ej: "cancion.mp3" (sube el archivo al repo)
  flores:  15                 // cuántos girasoles (7 a 15 se ve bien)
};
</script>

<div class="escena">
  <div class="cielo"></div>
  <canvas id="petalos"></canvas>

  <div class="mensaje" id="mensaje">
    <h1 id="titulo"></h1>
    <p id="texto"></p>
    <div class="firma" id="firma"></div>
  </div>

  <div class="jardin" id="jardin"></div>

  <div class="pista" id="pista">toca la pantalla</div>
  <button class="sonido" id="sonido" aria-label="Silenciar música">♪</button>

  <div class="portada" id="portada">
    <svg class="capullo" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 96 C46 70 54 52 50 34" fill="none" stroke="#2F6B4F" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 30 C34 30 26 42 30 56 C36 68 50 70 50 70 C50 70 64 68 70 56 C74 42 66 30 50 30Z" fill="#F5C518"/>
      <path d="M50 32 C42 40 40 56 50 68 C60 56 58 40 50 32Z" fill="#D98324" opacity=".55"/>
    </svg>
    <p>Alguien te dejó unas flores.</p>
    <button class="btn" id="abrir">Abrir las flores</button>
  </div>
</div>

<audio id="audio" loop></audio>

<script>
(function(){
  "use strict";

  /* ---------- permite personalizar desde el link: ?nombre=Rosa&mensaje=Hola ---------- */
  const url = new URLSearchParams(location.search);
  const nombre  = url.get("nombre")  ?? CONFIG.nombre;
  const mensaje = url.get("mensaje") ?? CONFIG.mensaje;
  const firma   = url.get("firma")   ?? CONFIG.firma;

  document.getElementById("titulo").textContent = nombre
    ? "Flores amarillas para " + nombre
    : "Flores amarillas para ti";
  document.getElementById("texto").textContent = mensaje;
  document.getElementById("firma").textContent = firma;

  const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const movil = innerWidth < 640;

  /* ================= ESTRELLAS ================= */
  const cielo = document.querySelector(".cielo");
  for (let i = 0; i < (movil ? 36 : 60); i++){
    const e = document.createElement("div");
    e.className = "estrella";
    const t = Math.random() * 1.8 + .8;
    e.style.cssText = `width:${t}px;height:${t}px;left:${Math.random()*100}%;top:${Math.random()*55}%;
                       animation-delay:${Math.random()*4}s`;
    cielo.appendChild(e);
  }

  /* ================= GIRASOLES ================= */
  function svgGirasol(){
    const ext = [], int = [];
    const N = 14;
    for (let i = 0; i < N; i++){
      const a = (360 / N) * i;
      const d = (i * 0.035).toFixed(3);
      ext.push(`<g transform="rotate(${a} 70 78)">
        <ellipse class="petalo" style="--p:${d}s" cx="70" cy="30" rx="9.5" ry="26" fill="url(#g1)"/></g>`);
      int.push(`<g transform="rotate(${a + 360/(N*2)} 70 78)">
        <ellipse class="petalo" style="--p:${(+d + .18).toFixed(3)}s" cx="70" cy="44" rx="8" ry="19" fill="var(--ambar)" opacity=".92"/></g>`);
    }
    return `<svg viewBox="0 0 140 300" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--sol-claro)"/>
          <stop offset="100%" stop-color="var(--sol)"/>
        </linearGradient>
        <radialGradient id="g2">
          <stop offset="55%" stop-color="var(--centro)"/>
          <stop offset="100%" stop-color="#6B3F19"/>
        </radialGradient>
      </defs>
      <path class="tallo" pathLength="1" d="M70 300 C 64 238, 76 168, 70 100"/>
      <path class="hoja hoja-izq" d="M70 206 C 40 198, 26 176, 30 156 C 54 158, 68 180, 70 206Z"/>
      <path class="hoja hoja-der" d="M70 172 C 100 166, 114 144, 110 124 C 86 126, 72 146, 70 172Z"/>
      <g class="cabeza">
        ${int.join("")}${ext.join("")}
        <circle class="nucleo" cx="70" cy="78" r="21" fill="url(#g2)"/>
        <circle class="nucleo" cx="70" cy="78" r="13" fill="#2E1908" opacity=".55"/>
      </g>
    </svg>`;
  }

  const jardin = document.getElementById("jardin");
  const total = Math.max(5, Math.min(18, CONFIG.flores));
  for (let i = 0; i < total; i++){
    const fondo = i < Math.floor(total * .45);           // fila de atrás
    const f = document.createElement("div");
    f.className = "flor";
    const ancho = fondo ? 22 + Math.random()*8 : 34 + Math.random()*14;
    f.style.setProperty("--w", ancho.toFixed(1));
    f.style.setProperty("--t", (i * .1 + .25).toFixed(2) + "s");
    f.style.setProperty("--giro", (1.1 + Math.random()*1.4).toFixed(2));
    f.style.setProperty("--vel", (3.6 + Math.random()*2.6).toFixed(2) + "s");
    f.style.setProperty("--desf", (-Math.random()*4).toFixed(2) + "s");
    f.style.left = (-6 + (i / (total - 1)) * 106 + (Math.random()*7 - 3.5)).toFixed(1) + "%";
    f.style.marginLeft = "-" + (ancho / 2).toFixed(1) + "vmin";
    if (fondo){ f.style.opacity = ".55"; f.style.filter = "blur(1.2px) brightness(.8)"; f.style.zIndex = 1; }
    else { f.style.zIndex = 2 + Math.round(ancho); }
    f.innerHTML = svgGirasol();
    jardin.appendChild(f);
  }

  /* ================= PÉTALOS QUE CAEN ================= */
  const cv = document.getElementById("petalos");
  const cx = cv.getContext("2d");
  let W, H, activo = false;
  const TONOS = ["#F5C518", "#FFE27A", "#D98324", "#FFD34E"];
  const lista = [];

  function medir(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr;
    H = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", medir);
  medir();

  function petalo(x, y, fuerte){
    return {
      x, y,
      r: 4 + Math.random() * 6,
      vy: (fuerte ? -2 - Math.random()*3 : .5 + Math.random()*1.1),
      vx: (Math.random() - .5) * (fuerte ? 6 : 1),
      g: Math.random() * Math.PI * 2,
      vg: (Math.random() - .5) * .07,
      fase: Math.random() * Math.PI * 2,
      color: TONOS[(Math.random() * TONOS.length) | 0],
      op: .55 + Math.random() * .45,
      grav: fuerte ? .07 : 0
    };
  }

  function sembrar(){
    const n = movil ? 16 : 28;
    for (let i = 0; i < n; i++){
      const p = petalo(Math.random() * innerWidth, Math.random() * -innerHeight, false);
      lista.push(p);
    }
  }

  function soltar(x, y){
    if (!activo) return;
    for (let i = 0; i < 14; i++) lista.push(petalo(x, y, true));
  }

  function pintar(){
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = lista.length - 1; i >= 0; i--){
      const p = lista[i];
      p.fase += .02;
      p.vy += p.grav;
      p.x += p.vx + Math.sin(p.fase) * .8;
      p.y += p.vy;
      p.g += p.vg;
      if (p.grav) p.vx *= .985;

      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.g);
      cx.globalAlpha = p.op;
      cx.fillStyle = p.color;
      cx.beginPath();
      cx.ellipse(0, 0, p.r * .42, p.r, 0, 0, Math.PI * 2);
      cx.fill();
      cx.restore();

      if (p.y > innerHeight + 40){
        if (p.grav) lista.splice(i, 1);
        else { p.y = -20; p.x = Math.random() * innerWidth; }
      }
    }
    requestAnimationFrame(pintar);
  }

  /* ================= APERTURA ================= */
  const portada = document.getElementById("portada");
  const audio = document.getElementById("audio");
  const btnSonido = document.getElementById("sonido");
  let abierto = false;

  function abrir(){
    if (abierto) return;
    abierto = true;
    portada.classList.add("fuera");
    jardin.classList.add("abierto");

    if (CONFIG.musica){
      audio.src = CONFIG.musica;
      audio.volume = .5;
      audio.play().then(() => btnSonido.classList.add("activa")).catch(() => {});
    }

    const espera = suave ? 200 : 1400;
    setTimeout(() => {
      document.getElementById("mensaje").classList.add("visible");
      document.getElementById("pista").classList.add("visible");
      document.querySelectorAll(".flor").forEach(f => f.classList.add("mece"));
      if (!suave){ activo = true; sembrar(); pintar(); }
    }, espera);
  }

  document.getElementById("abrir").addEventListener("click", abrir);

  addEventListener("pointerdown", e => {
    if (!abierto) return;
    soltar(e.clientX, e.clientY);
  });

  btnSonido.addEventListener("click", e => {
    e.stopPropagation();
    audio.muted = !audio.muted;
    btnSonido.textContent = audio.muted ? "♪̸" : "♪";
  });
})();
</script>
</body>
</html>
